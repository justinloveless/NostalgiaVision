# Run `git config core.hooksPath .githooks` once per clone (it's repo-wide once set, not
# per-worktree). Xcode reads the generated .xcodeproj, not this file, so the .githooks/post-merge
# and post-checkout hooks rerun `xcodegen generate` whenever a pull/checkout changes this file —
# otherwise Xcode silently keeps building against a stale package/target reference (see ORT-301).
name: NostalgiaVision
options:
  bundleIdPrefix: com.nostalgiavision
  deploymentTarget:
    tvOS: "17.0"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    # Pinned to the exact commit `main` resolved to as of 2026-09-21 (still its current tip at the
    # time of pinning) rather than the floating branch: a branch reference re-resolves over the
    # network on every open/build, and any hiccup there was the actual cause of the "Missing
    # package product" build failure — the Swift sources themselves were never the problem.
    revision: 75e590e770f7f01d088ced2546deed9817b660ae
targets:
  NostalgiaVision:
    type: application
    platform: tvOS
    sources:
      - Sources
    dependencies:
      - package: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nostalgiavision.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  NostalgiaVisionTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - Tests
    dependencies:
      - target: NostalgiaVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nostalgiavision.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  NostalgiaVisionUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITemp
    dependencies:
      - target: NostalgiaVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nostalgiavision.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  NostalgiaVision:
    build:
      targets:
        NostalgiaVision: all
        NostalgiaVisionTests: [test]
        NostalgiaVisionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NostalgiaVisionTests
        - NostalgiaVisionUITests
