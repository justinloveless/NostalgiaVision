<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="title desc">
  <title id="title">Nostalgia Vision logo</title>
  <desc id="desc">Retro broadcast CRT mark with Nostalgia Vision wordmark; knobs at bottom-right of front panel</desc>
  <defs>
    <style>
      .charcoal { fill: #1C1F26; }
      .cream { fill: #F5F0E6; }
      .amber { fill: #C4783A; stroke: #C4783A; }
      .recess { fill: #14161C; }
      .wordmark {
        fill: #1C1F26;
        font-family: "Avenir Next", "Nunito", "Segoe UI", "Helvetica Neue", sans-serif;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </defs>

  <g transform="translate(120 8)">
    <g class="amber" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="120" cy="38" r="6" fill="#C4783A"/>
      <line x1="120" y1="38" x2="72" y2="10" stroke-width="5.5"/>
      <line x1="120" y1="38" x2="168" y2="10" stroke-width="5.5"/>
    </g>
    <rect class="charcoal" x="40" y="44" width="160" height="172" rx="36" ry="36"/>
    <rect class="cream" x="54" y="58" width="132" height="112" rx="18" ry="18"/>
    <g stroke="#C4783A" stroke-width="4" stroke-linecap="round" opacity="0.95">
      <line x1="68" y1="74" x2="172" y2="74"/>
      <line x1="68" y1="87" x2="172" y2="87"/>
      <line x1="68" y1="100" x2="172" y2="100"/>
      <line x1="68" y1="113" x2="172" y2="113"/>
      <line x1="68" y1="126" x2="172" y2="126"/>
      <line x1="68" y1="139" x2="172" y2="139"/>
      <line x1="68" y1="152" x2="172" y2="152"/>
      <line x1="68" y1="165" x2="172" y2="165"/>
    </g>
    <ellipse class="recess" cx="100" cy="192" rx="36" ry="14"/>
    <circle cx="86" cy="190" r="3.2" fill="#C4783A"/>
    <circle cx="100" cy="190" r="3.2" fill="#C4783A"/>
    <circle cx="114" cy="190" r="3.2" fill="#C4783A"/>
    <path d="M94 198 L100 203 L106 198" fill="none" stroke="#C4783A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="168" cy="194" r="9" fill="#C4783A"/>
    <circle cx="186" cy="194" r="6.5" fill="#C4783A"/>
  </g>

  <text class="wordmark" x="240" y="330" text-anchor="middle">Nostalgia Vision</text>
</svg>
