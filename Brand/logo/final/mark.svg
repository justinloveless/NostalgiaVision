<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Nostalgia Vision mark</title>
  <desc id="desc">Stylized CRT television with amber scan lines and rabbit-ear antenna</desc>
  <defs>
    <style>
      .charcoal { fill: #1C1F26; }
      .cream { fill: #F5F0E6; }
      .amber { fill: #C4783A; stroke: #C4783A; }
    </style>
  </defs>

  <!-- Antenna -->
  <g class="amber" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="120" cy="42" r="5" fill="#C4783A"/>
    <line x1="120" y1="42" x2="78" y2="14" stroke-width="5"/>
    <line x1="120" y1="42" x2="162" y2="14" stroke-width="5"/>
  </g>

  <!-- TV body -->
  <rect class="charcoal" x="48" y="48" width="144" height="144" rx="28" ry="28"/>

  <!-- Screen -->
  <rect class="cream" x="64" y="64" width="96" height="96" rx="14" ry="14"/>

  <!-- Scan lines -->
  <g stroke="#C4783A" stroke-width="4" stroke-linecap="round">
    <line x1="76" y1="80" x2="148" y2="80"/>
    <line x1="76" y1="94" x2="148" y2="94"/>
    <line x1="76" y1="108" x2="148" y2="108"/>
    <line x1="76" y1="122" x2="148" y2="122"/>
    <line x1="76" y1="136" x2="148" y2="136"/>
    <line x1="76" y1="150" x2="148" y2="150"/>
  </g>

  <!-- Knobs -->
  <circle class="amber" cx="178" cy="88" r="8" fill="#C4783A"/>
  <circle class="amber" cx="178" cy="116" r="6" fill="#C4783A"/>
</svg>
