<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Nostalgia Vision mark</title>
  <desc id="desc">Polished CRT television mark with soft amber scan lines, rabbit-ear antenna, and bottom-right front knobs</desc>
  <defs>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4783A" stop-opacity="0"/>
      <stop offset="12%" stop-color="#C4783A" stop-opacity="0.95"/>
      <stop offset="88%" stop-color="#C4783A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C4783A" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .charcoal { fill: #1C1F26; }
      .cream { fill: #F5F0E6; }
      .amber { fill: #C4783A; stroke: #C4783A; }
      .recess { fill: #14161C; }
    </style>
  </defs>

  <!-- Antenna -->
  <g class="amber" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <circle cx="120" cy="38" r="6" fill="#C4783A"/>
    <line x1="120" y1="38" x2="72" y2="10" stroke-width="5"/>
    <line x1="120" y1="38" x2="168" y2="10" stroke-width="5"/>
    <circle cx="72" cy="10" r="2.5" fill="#C4783A"/>
    <circle cx="168" cy="10" r="2.5" fill="#C4783A"/>
  </g>

  <!-- TV body -->
  <rect class="charcoal" x="40" y="44" width="160" height="172" rx="36" ry="36"/>

  <!-- Screen -->
  <rect class="cream" x="54" y="58" width="132" height="112" rx="18" ry="18"/>

  <!-- Soft scan lines -->
  <g filter="url(#softGlow)">
    <line x1="68" y1="74" x2="172" y2="74" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="87" x2="172" y2="87" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="100" x2="172" y2="100" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="113" x2="172" y2="113" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="126" x2="172" y2="126" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="139" x2="172" y2="139" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="152" x2="172" y2="152" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="165" x2="172" y2="165" stroke="url(#scan)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom recess -->
  <ellipse class="recess" cx="96" cy="192" rx="34" ry="13"/>
  <circle cx="82" cy="190" r="3" fill="#C4783A"/>
  <circle cx="96" cy="190" r="3" fill="#C4783A"/>
  <circle cx="110" cy="190" r="3" fill="#C4783A"/>
  <path d="M90 198 L96 202.5 L102 198" fill="none" stroke="#C4783A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Knobs bottom-right -->
  <circle cx="158" cy="192" r="8.5" fill="#C4783A"/>
  <circle cx="178" cy="192" r="6.5" fill="#C4783A"/>
</svg>
