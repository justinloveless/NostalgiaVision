<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Nostalgia Vision mark (orange / charcoal swap)</title>
  <desc id="desc">Color-swapped CRT mark: amber body with charcoal accents; knobs at bottom-right</desc>
  <defs>
    <linearGradient id="scanSwap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1F26" stop-opacity="0"/>
      <stop offset="12%" stop-color="#1C1F26" stop-opacity="0.95"/>
      <stop offset="88%" stop-color="#1C1F26" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1C1F26" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlowSwap" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Antenna (charcoal) -->
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlowSwap)" fill="#1C1F26" stroke="#1C1F26">
    <circle cx="120" cy="38" r="6"/>
    <line x1="120" y1="38" x2="72" y2="10" stroke-width="5"/>
    <line x1="120" y1="38" x2="168" y2="10" stroke-width="5"/>
    <circle cx="72" cy="10" r="2.5"/>
    <circle cx="168" cy="10" r="2.5"/>
  </g>

  <!-- TV body (amber) -->
  <rect x="40" y="44" width="160" height="172" rx="36" ry="36" fill="#C4783A"/>

  <!-- Screen -->
  <rect x="54" y="58" width="132" height="112" rx="18" ry="18" fill="#F5F0E6"/>

  <!-- Soft scan lines (charcoal) -->
  <g filter="url(#softGlowSwap)">
    <line x1="68" y1="74" x2="172" y2="74" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="87" x2="172" y2="87" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="100" x2="172" y2="100" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="113" x2="172" y2="113" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="126" x2="172" y2="126" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="139" x2="172" y2="139" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="152" x2="172" y2="152" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="165" x2="172" y2="165" stroke="url(#scanSwap)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom recess -->
  <ellipse cx="96" cy="192" rx="34" ry="13" fill="#A8622E"/>
  <circle cx="82" cy="190" r="3" fill="#1C1F26"/>
  <circle cx="96" cy="190" r="3" fill="#1C1F26"/>
  <circle cx="110" cy="190" r="3" fill="#1C1F26"/>
  <path d="M90 198 L96 202.5 L102 198" fill="none" stroke="#1C1F26" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Knobs bottom-right (charcoal) -->
  <circle cx="158" cy="192" r="8.5" fill="#1C1F26"/>
  <circle cx="178" cy="192" r="6.5" fill="#1C1F26"/>
</svg>
